<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siete Lunas · Revenue Dashboard Q1 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #08080A;
  --tx: #E8E8E8;
  --g: #C8A45E;
  --gl: #D9B97A;
  --cd: #14141A;
  --cd2: #1C1C24;
  --bd: #2A2A33;
  --bd2: #1F1F28;
  --sb: #888;
  --red: #EF4444;
  --grn: #10B981;
  --blue: #5B9BD5;
  --purple: #A78BFA;
  --cyan: #22D3EE;
  --orange: #F59E0B;
  --pink: #EC4899;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-weight: 300;
}
::selection { background: var(--g); color: #000; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--g); }

/* ===== LOGIN ===== */
.login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(200, 164, 94, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(200, 164, 94, 0.04) 0%, transparent 50%);
}
.login-overlay.hidden { display: none; }

.login-box {
  background: transparent;
  border: none;
  border-radius: 16px;
  padding: 48px 40px;
  width: 92%;
  max-width: 420px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.login-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--g), transparent);
}

.login-mark {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--g), var(--gl));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 700;
  color: #000;
  margin: 0 auto 24px;
}

.login-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--g);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--sb);
  margin-bottom: 36px;
}

.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 0 auto 32px;
  padding: 8px 0;
}
.pin-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--bd);
  transition: all 0.2s;
}
.pin-dot.filled {
  background: var(--g);
  border-color: var(--g);
  box-shadow: 0 0 12px rgba(200, 164, 94, 0.5);
  transform: scale(1.15);
}
.pin-dots.error .pin-dot {
  border-color: var(--red);
  background: var(--red);
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 8px;
}
.pin-key {
  aspect-ratio: 1.4 / 1;
  background: rgba(200, 164, 94, 0.04);
  border: 1px solid rgba(200, 164, 94, 0.15);
  border-radius: 12px;
  color: var(--tx);
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.pin-key::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(200,164,94,0.0), rgba(200,164,94,0.0));
  transition: background 0.2s;
}
.pin-key:hover {
  border-color: var(--g);
  color: var(--g);
}
.pin-key:hover::before {
  background: linear-gradient(135deg, rgba(200,164,94,0.08), rgba(200,164,94,0.0));
}
.pin-key:active {
  transform: scale(0.94);
  background: var(--g);
  color: #000;
  border-color: var(--g);
}
.pin-key.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
  pointer-events: none;
}
.pin-key.action {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sb);
  font-weight: 500;
}
.pin-key.action:hover {
  color: var(--g);
}

.login-footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--bd2);
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--sb);
}

/* ===== APP ===== */
.app { display: none; }
.app.visible { display: block; }

/* ===== HEADER ===== */
.hdr {
  background: linear-gradient(180deg, #0E0E12, var(--bg));
  border-bottom: 1px solid var(--bd);
  padding: 14px 24px;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(20px);
}
.hi {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.li {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--g), var(--gl));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #000;
  font-family: 'Cormorant Garamond', serif;
}
.logo h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--g);
  letter-spacing: 2px;
}
.ls {
  font-size: 9px;
  color: var(--sb);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: -2px;
}
.bdg {
  font-size: 9px;
  background: var(--cd2);
  border: 1px solid var(--bd);
  padding: 3px 8px;
  border-radius: 20px;
  color: var(--sb);
  letter-spacing: 1px;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.user-pill {
  font-size: 9px;
  background: rgba(200, 164, 94, 0.08);
  border: 1px solid rgba(200, 164, 94, 0.25);
  padding: 3px 10px;
  border-radius: 20px;
  color: var(--g);
  letter-spacing: 1px;
}
.logout-btn {
  font-size: 9px;
  background: var(--cd2);
  border: 1px solid var(--bd);
  padding: 3px 10px;
  border-radius: 20px;
  color: var(--sb);
  cursor: pointer;
  letter-spacing: 1px;
  font-family: inherit;
  text-transform: uppercase;
  transition: all 0.2s;
}
.logout-btn:hover { color: var(--g); border-color: var(--g); }

/* ===== NAV ===== */
nav {
  display: flex;
  gap: 2px;
  background: var(--cd);
  border-radius: 10px;
  padding: 3px;
  border: 1px solid var(--bd2);
  flex-wrap: wrap;
}
nav button {
  background: none;
  border: none;
  color: var(--sb);
  font-family: inherit;
  font-size: 10px;
  font-weight: 500;
  padding: 6px 11px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
nav button:hover { color: var(--tx); }
nav button.act {
  background: var(--g);
  color: #000;
  font-weight: 600;
}

/* ===== CONTENT ===== */
.ct {
  max-width: 1440px;
  margin: 0 auto;
  padding: 16px 24px 40px;
}
.tab-content { display: none; animation: fadeIn 0.4s; }
.tab-content.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== KPI CARDS ===== */
.kr {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--cd);
  border: 1px solid var(--bd2);
  border-radius: 12px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--g), transparent);
}
.kpi.featured::before { background: linear-gradient(90deg, var(--gl), var(--g), transparent); height: 3px; }
.kl {
  font-size: 9px;
  color: var(--sb);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
}
.kv {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 600;
  color: var(--g);
  line-height: 1.1;
}
.kv.wh { color: var(--tx); }
.kv.rd { color: var(--red); }
.kv.gn { color: var(--grn); }
.kv.bl { color: var(--blue); }
.kd {
  font-size: 10px;
  color: var(--sb);
  margin-top: 4px;
}

/* ===== CARDS ===== */
.cd-card {
  background: var(--cd);
  border: 1px solid var(--bd2);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 14px;
}
.tt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--g);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.ts {
  font-size: 9px;
  color: var(--sb);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.g2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
.g3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
@media (max-width: 900px) {
  .g2, .g3 { grid-template-columns: 1fr; }
}

/* ===== SECTION HEADERS ===== */
.sh {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--bd2);
}
.sh-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--g);
  letter-spacing: 1px;
}
.sh-sub {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sb);
}

/* ===== BANNER ===== */
.banner {
  background: linear-gradient(90deg, rgba(200, 164, 94, 0.1), transparent);
  border: 1px solid rgba(200, 164, 94, 0.25);
  border-left: 3px solid var(--g);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
}
.banner-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--tx);
}
.banner-meta {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--g);
  margin-top: 2px;
}
.banner-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* ===== CHARTS ===== */
.chart-wrap {
  position: relative;
  height: 280px;
  margin-top: 8px;
}
.chart-wrap.tall { height: 360px; }

/* ===== TABLES ===== */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.tbl th, .tbl td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--bd2);
}
.tbl th {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--g);
  font-weight: 600;
  background: var(--cd2);
}
.tbl td { color: var(--tx); font-weight: 300; }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.gold { color: var(--g); font-weight: 500; }
.tbl tr:hover td { background: rgba(200, 164, 94, 0.04); }

/* ===== CALENDAR ===== */
.cal-month { margin-bottom: 24px; }
.cal-month-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--g);
  margin-bottom: 10px;
  text-transform: capitalize;
  letter-spacing: 1px;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day-header {
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sb);
  text-align: center;
  padding: 6px 4px;
}
.cal-cell {
  aspect-ratio: 1.3 / 1;
  background: var(--cd2);
  border-radius: 6px;
  padding: 5px 7px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  position: relative;
}
.cal-cell.empty { opacity: 0; pointer-events: none; cursor: default; }
.cal-cell:hover:not(.empty) { border-color: var(--g); transform: scale(1.05); z-index: 5; box-shadow: 0 4px 16px rgba(200,164,94,0.25); }
.cal-cell.has-events::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 7px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--g);
  box-shadow: 0 0 6px rgba(200,164,94,0.6);
}
.cal-cell-date { color: var(--tx); font-size: 10px; }
.cal-cell-occ { font-size: 9px; color: var(--sb); align-self: flex-end; }
.cal-cell.occ-0 { background: var(--cd2); }
.cal-cell.occ-1 { background: rgba(200, 164, 94, 0.10); }
.cal-cell.occ-2 { background: rgba(200, 164, 94, 0.20); }
.cal-cell.occ-3 { background: rgba(200, 164, 94, 0.32); }
.cal-cell.occ-4 { background: rgba(200, 164, 94, 0.45); }
.cal-cell.occ-5 { background: rgba(200, 164, 94, 0.6); }
.cal-cell.occ-6 { background: rgba(200, 164, 94, 0.78); }
.cal-cell.occ-7 { background: var(--g); }
.cal-cell.occ-7 .cal-cell-date,
.cal-cell.occ-7 .cal-cell-occ { color: #000; font-weight: 600; }

.cal-legend {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sb);
}
.cal-legend-scale { display: flex; gap: 2px; }
.cal-legend-scale > div { width: 16px; height: 16px; border-radius: 3px; }

/* ===== MODAL DEL DÍA ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(8px);
  padding: 20px;
  animation: fadeInBg 0.25s;
}
.modal-overlay.show { display: flex; }
@keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 16px;
  width: 100%;
  max-width: 720px;
  max-height: 86vh;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.3s;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--g), transparent);
}

.modal-header {
  padding: 22px 26px 18px;
  border-bottom: 1px solid var(--bd2);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.modal-date-block { flex: 1; }
.modal-date-day {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 600;
  color: var(--g);
  line-height: 1;
}
.modal-date-month {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--sb);
  margin-top: 4px;
}
.modal-date-weekday {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--tx);
  font-weight: 500;
  margin-top: 6px;
  letter-spacing: 1px;
}

.modal-close {
  background: var(--cd2);
  border: 1px solid var(--bd);
  color: var(--sb);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  font-family: inherit;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover { color: var(--g); border-color: var(--g); transform: rotate(90deg); }

.modal-stats {
  padding: 16px 26px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  border-bottom: 1px solid var(--bd2);
}
.modal-stat-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sb);
  margin-bottom: 4px;
}
.modal-stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--g);
  line-height: 1;
}
.modal-stat-value.wh { color: var(--tx); }

.modal-body {
  padding: 18px 26px 22px;
  overflow-y: auto;
  flex: 1;
}
.modal-section-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sb);
  margin-bottom: 10px;
}

.modal-empty {
  padding: 30px 0;
  text-align: center;
  color: var(--sb);
  font-size: 12px;
  letter-spacing: 1px;
}

.modal-res-card {
  background: var(--cd2);
  border: 1px solid var(--bd2);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  transition: border-color 0.2s;
}
.modal-res-card:hover { border-color: var(--g); }
.modal-res-card.cancelled { opacity: 0.5; }
.modal-res-villa-tag {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 14px;
  color: #000;
}
.modal-res-villa-V1 { background: var(--orange); }
.modal-res-villa-V2 { background: var(--cyan); }
.modal-res-villa-V3 { background: var(--red); }
.modal-res-villa-V4 { background: var(--g); }
.modal-res-villa-V5 { background: var(--blue); }
.modal-res-villa-V6 { background: var(--grn); }
.modal-res-villa-V7 { background: var(--purple); }
.modal-res-villa-UNK { background: var(--bd); color: var(--sb); }

.modal-res-info { min-width: 0; }
.modal-res-guest {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--tx);
  letter-spacing: 0.5px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.modal-res-meta {
  display: flex;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.modal-res-meta-item {
  font-size: 9px;
  color: var(--sb);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.modal-res-meta-item strong { color: var(--tx); font-weight: 500; }

.modal-res-amount {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--g);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 600px) {
  .modal-stats { grid-template-columns: repeat(2, 1fr); }
  .modal-res-card { grid-template-columns: auto 1fr; }
  .modal-res-amount { grid-column: 2; text-align: left; font-size: 15px; }
  .modal-date-day { font-size: 28px; }
}

/* ===== VILLAS ===== */
.villas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.villa-card {
  background: var(--cd);
  border: 1px solid var(--bd2);
  border-radius: 12px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.villa-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--g), transparent);
}
.villa-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--g);
  margin-bottom: 2px;
  letter-spacing: 1px;
}
.villa-type {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sb);
  margin-bottom: 18px;
}
.villa-stats { display: grid; gap: 9px; }
.villa-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--bd2);
}
.villa-stat-row:last-of-type { border-bottom: none; padding-bottom: 0; }
.villa-stat-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sb);
}
.villa-stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--tx);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.villa-stat-value.gold { color: var(--g); }

.villa-occ-bar {
  margin-top: 8px;
  margin-bottom: 4px;
  height: 4px;
  background: var(--cd2);
  border-radius: 2px;
  overflow: hidden;
}
.villa-occ-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--g), var(--gl));
  transition: width 1s ease-out;
}

/* ===== PILLS ===== */
.pill {
  display: inline-block;
  padding: 3px 10px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  border: 1px solid;
  border-radius: 20px;
}
.pill.green { color: var(--grn); border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); }
.pill.yellow { color: var(--orange); border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.08); }
.pill.red { color: var(--red); border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.08); }
.pill.blue { color: var(--blue); border-color: rgba(91, 155, 213, 0.4); background: rgba(91, 155, 213, 0.08); }
.pill.gold { color: var(--g); border-color: rgba(200, 164, 94, 0.4); background: rgba(200, 164, 94, 0.08); }
.pill.gray { color: #999; border-color: rgba(160, 160, 160, 0.4); background: rgba(160, 160, 160, 0.08); }

/* ===== RESERVATIONS LIST ===== */
.res-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.res-filter-btn {
  background: var(--cd2);
  border: 1px solid var(--bd);
  color: var(--sb);
  padding: 6px 14px;
  border-radius: 20px;
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.res-filter-btn:hover { color: var(--tx); border-color: var(--g); }
.res-filter-btn.active { background: var(--g); color: #000; border-color: var(--g); font-weight: 600; }
.res-search {
  flex: 1;
  min-width: 200px;
  background: var(--cd2);
  border: 1px solid var(--bd);
  color: var(--tx);
  padding: 7px 14px;
  border-radius: 20px;
  font-family: inherit;
  font-size: 11px;
  outline: none;
}
.res-search:focus { border-color: var(--g); }

.res-list { display: flex; flex-direction: column; gap: 4px; }
.res-row {
  background: var(--cd);
  border: 1px solid var(--bd2);
  border-radius: 8px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: auto 1fr 100px 90px 130px 100px;
  gap: 16px;
  align-items: center;
  font-size: 11px;
  transition: all 0.2s;
}
.res-row:hover { border-color: var(--g); background: var(--cd2); }
.res-row.cancelled { opacity: 0.55; }
.res-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--tx);
  letter-spacing: 0.5px;
}
.res-meta {
  display: flex;
  gap: 12px;
  color: var(--sb);
  font-size: 10px;
  letter-spacing: 0.5px;
  margin-top: 2px;
}
.res-amount {
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--g);
  font-size: 13px;
  font-weight: 500;
  font-family: 'Cormorant Garamond', serif;
}

@media (max-width: 768px) {
  .res-row { grid-template-columns: 1fr; gap: 4px; }
}


/* ===== MATRIZ CANAL x MES ===== */
.matrix-wrap { overflow-x: auto; margin-top: 10px; margin-bottom: 18px; }
.matrix-table { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 11px; }
.matrix-table th, .matrix-table td { padding: 10px 12px; text-align: right; border-radius: 8px; font-variant-numeric: tabular-nums; }
.matrix-table th { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sb); font-weight: 600; background: var(--cd2); text-align: center; }
.matrix-table th.canal-header { text-align: left; color: var(--g); }
.matrix-table td.canal-name { text-align: left; font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 600; color: var(--tx); background: var(--cd2); letter-spacing: 0.5px; }
.matrix-cell { background: var(--cd2); color: var(--tx); cursor: pointer; transition: all 0.15s; border: 1px solid transparent; font-weight: 500; position: relative; }
.matrix-cell:hover { border-color: var(--g); transform: scale(1.04); z-index: 5; }
.matrix-cell.selected { border-color: var(--g); background: rgba(200, 164, 94, 0.25); color: var(--g); font-weight: 700; box-shadow: 0 0 12px rgba(200, 164, 94, 0.4); }
.matrix-cell.empty { color: #444; cursor: default; }
.matrix-cell.empty:hover { border-color: transparent; transform: none; }
.matrix-cell.h-0 { background: var(--cd2); color: var(--sb); }
.matrix-cell.h-1 { background: rgba(200, 164, 94, 0.08); }
.matrix-cell.h-2 { background: rgba(200, 164, 94, 0.16); }
.matrix-cell.h-3 { background: rgba(200, 164, 94, 0.26); }
.matrix-cell.h-4 { background: rgba(200, 164, 94, 0.38); }
.matrix-cell.h-5 { background: rgba(200, 164, 94, 0.55); color: var(--tx); font-weight: 600; }
.matrix-table tr.totals td { background: rgba(200, 164, 94, 0.12); border-top: 1px solid var(--g); color: var(--g); font-weight: 700; font-family: 'Cormorant Garamond', serif; font-size: 14px; }
.matrix-table tr.totals td.canal-name { background: rgba(200, 164, 94, 0.12); color: var(--g); }
.matrix-table td.col-total { background: rgba(200, 164, 94, 0.12); color: var(--g); font-weight: 700; font-family: 'Cormorant Garamond', serif; font-size: 14px; }
.matrix-table th.col-total { background: var(--cd2); color: var(--g); }
.matrix-detail { margin-top: 14px; background: var(--cd2); border: 1px solid var(--bd2); border-left: 3px solid var(--g); border-radius: 12px; padding: 18px 22px; display: none; }
.matrix-detail.show { display: block; animation: fadeIn 0.3s; }
.matrix-detail-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.matrix-detail-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--g); letter-spacing: 1px; }
.matrix-detail-subtitle { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--sb); }
.matrix-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.matrix-detail-stat-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sb); margin-bottom: 4px; }
.matrix-detail-stat-value { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--tx); line-height: 1; }
.matrix-detail-stat-value.gold { color: var(--g); }
.matrix-prelim-badge { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-left: 4px; font-weight: 600; }

</style>
</head>

124.00 y otra vez dentro del folio 551027. El folio 23780 del 10-may por $1,777.00 aparece en dos hojas distintas. Los dos son gastos reales y válidos, y los dos están contados una sola vez."},{"sev":"media","titulo":"Relación de facturas Booking excluida del cálculo","monto":null,"detalle":"Una de las hojas del paquete es la relación de facturas Booking con huéspedes como Tim Ricker, Kelly Vaughn y Florine Dubois. Es información de ingresos que se traspapeló entre los comprobantes de gasto, y quedó fuera del cálculo."},{"sev":"media","titulo":"Compras de agosto separadas del cierre","monto":1652.93,"detalle":"Hay compras del 1 y 2 de agosto de Bugarín e Hidrosol dentro del paquete. Se separaron para no distorsionar julio y quedan listas para el corte de agosto."},{"sev":"baja","titulo":"Formatos de fecha mezclados en las capturas","monto":null,"detalle":"Las hojas de Bugarín alternan día/mes/año y mes/día/año, y la hoja complementaria de julio viene toda en mes/día/año. Para no depender del formato, cada partida se ubicó por la secuencia de folio del proveedor, que corre de forma ascendente de enero a mayo y se reinicia en junio. Con ese criterio todos los meses quedan asignados correctamente."},{"sev":"baja","titulo":"Dos fechas mal capturadas, corregidas por folio","monto":null,"detalle":"Alejandrina folio 181873 venía como 25-03 estando entre compras del 24 y 26 de abril, se reclasificó a abril. Bugarín folio 1370 venía como 4/4 estando entre el 2 y el 5 de julio, se reclasificó a julio."},{"sev":"baja","titulo":"Cambio de proveedor de abarrotes en abril y mayo","monto":null,"detalle":"Del 7 de abril al 7 de mayo las compras de abarrotes se hicieron con Alejandrina en lugar de Bugarín. No es un hueco de información sino un cambio de proveedor, y es la razón principal de que abril sea el mes más alto del periodo."},{"sev":"baja","titulo":"Un concepto sin descripción","monto":150.0,"detalle":"Casa del Cemento folio 3477 del 22-abr trae una partida de $150.00 por 1 // ===== AUTH (PIN PAD) =====
const loginOverlay = document.getElementById('loginOverlay');
const app = document.getElementById('app');
const userNameDisplay = document.getElementById('userNameDisplay');
const logoutBtn = document.getElementById('logoutBtn');
const pinDots = document.getElementById('pinDots');
const pinPad = document.getElementById('pinPad');

let currentPin = '';
let isProcessing = false;

function updateDots() {
  const dots = pinDots.querySelectorAll('.pin-dot');
  dots.forEach((d, i) => d.classList.toggle('filled', i < currentPin.length));
}

function flashError() {
  pinDots.classList.add('error');
  setTimeout(() => {
    pinDots.classList.remove('error');
    currentPin = '';
    updateDots();
    isProcessing = false;
  }, 600);
}

function tryLogin() {
  const user = USERS[currentPin];
  if (user) {
    sessionStorage.setItem('sl_user', JSON.stringify({ pin: currentPin, ...user }));
    setTimeout(() => enterApp(user), 150); // pequeña pausa para ver dots llenos
  } else {
    flashError();
  }
}

function pressKey(key) {
  if (isProcessing) return;
  if (key === 'del') {
    currentPin = currentPin.slice(0, -1);
    updateDots();
    return;
  }
  if (currentPin.length < 4) {
    currentPin += key;
    updateDots();
    if (currentPin.length === 4) {
      isProcessing = true;
      setTimeout(tryLogin, 100);
    }
  }
}

// Click en botones del pin pad
pinPad.addEventListener('click', e => {
  const btn = e.target.closest('.pin-key[data-key]');
  if (btn) pressKey(btn.dataset.key);
});

// Soporte teclado físico
document.addEventListener('keydown', e => {
  if (loginOverlay.classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pressKey(e.key);
  else if (e.key === 'Backspace') pressKey('del');
});

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('sl_user');
  app.classList.remove('visible');
  loginOverlay.classList.remove('hidden');
  currentPin = '';
  updateDots();
  isProcessing = false;
});

function enterApp(user) {
  loginOverlay.classList.add('hidden');
  app.classList.add('visible');
  userNameDisplay.textContent = user.name.toUpperCase();
  currentPin = '';
  updateDots();
  isProcessing = false;
  initApp();
}

const mainContent = document.getElementById('mainContent');

function initApp() {
  if (navEl.children.length > 0) return;
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.addEventListener('click', () => switchTab(t.id));
    navEl.appendChild(btn);

    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id = 'tab-' + t.id;
    mainContent.appendChild(div);
  });
  switchTab('overview');
}

function switchTab(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('act', b.dataset.tab === id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + id));

  const handler = window.renderers[id];
  if (handler) handler();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const fmtMXN = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(n || 0);
const fmtMXNDec = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
const fmtNum = n => new Intl.NumberFormat('es-MX').format(n || 0);
const fmtPct = n => (n || 0).toFixed(1) + '%';
const fmtDate = s => {
  if (!s) return '—';
  try { const d = new Date(s); return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }); } catch(e) { return s; }
};

function safeChart(canvasId, config) {
  if (typeof Chart === 'undefined') {
    const canvas = document.getElementById(canvasId);
    if (canvas && canvas.parentElement) {
      canvas.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--sb);font-size:11px;letter-spacing:1px">Cargando gráfico...</div>';
    }
    return null;
  }
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  return new Chart(canvas.getContext('2d'), config);
}

      }],

    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => fmtMXN(ctx.parsed.x) + '  ·  ' + bl[ctx.dataIndex].pct.toFixed(1) + '% del ingreso' } },
      },
      scales: {
        x: { grid: { color: C_BORDER }, ticks: { color: C_DIM, font: { size: 10 }, callback: v => fmtMXN(v) } },
        y: { grid: { display: false }, ticks: { color: C_DIM, font: { size: 11 } } },
      },
    },
  });

  // ---- chart 2: ingreso vs costo vs margen ----
  const pm = K.por_mes;
  const maxPesos = Math.max(...pm.map(f => f.ingreso));
  const yMaxPesos = maxPesos * 1.25;
  const maxPct = Math.max(...pm.map(f => f.margen));
  const minPct = Math.min(0, ...pm.map(f => f.margen));
  const y1Max = maxPct * 1.3;
  const HOLGURA = 0.10;
  let y1Min = minPct - Math.abs(maxPct - minPct) * 0.12;
  pm.forEach(f => {
    const alturaBarra = f.ingreso / yMaxPesos + HOLGURA;
    if (alturaBarra >= 1) return;
    const limite = (f.margen - y1Max * alturaBarra) / (1 - alturaBarra);
    if (limite < y1Min) y1Min = limite;
  });
  safeChart('rentMesChart', {
    data: {
      labels: pm.map(f => cap(f.mes)),
      datasets: [
        { type: 'bar', label: 'Ingreso', data: pm.map(f => f.ingreso), backgroundColor: C_GOLD_D, borderRadius: 3, order: 3, yAxisID: 'y' },
        { type: 'bar', label: 'Costo', data: pm.map(f => f.total), backgroundColor: C_BLUE, borderRadius: 3, order: 2, yAxisID: 'y' },
        { type: 'line', label: 'Margen', data: pm.map(f => f.margen), borderColor: C_GREEN, backgroundColor: C_GREEN,
          borderWidth: 2, pointRadius: 4, pointBackgroundColor: C_BG, pointBorderWidth: 2, tension: 0.3, order: 1, yAxisID: 'y1' },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: C_DIM, font: { size: 11 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + (ctx.dataset.yAxisID === 'y1' ? fmtPct(ctx.parsed.y) : fmtMXN(ctx.parsed.y)) } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: C_DIM, font: { size: 11 } } },
        y: { min: 0, max: yMaxPesos, grid: { color: C_BORDER }, ticks: { color: C_DIM, font: { size: 10 }, callback: v => fmtMXN(v) } },
        y1: { position: 'right', min: y1Min, max: y1Max, grid: { display: false },
              ticks: { color: C_GREEN, font: { size: 10 }, callback: v => v.toFixed(0) + '%' } },
      },
    },
  });

  // ---- chart 3: nomina fiscal vs efectivo ----
  safeChart('rentNominaChart', {
    type: 'bar',
    data: {
      labels: pm.map(f => cap(f.mes).slice(0, 3)),
      datasets: [
        { label: 'Nómina fiscal', data: pm.map(f => f.nomina_fiscal), backgroundColor: C_GOLD, borderRadius: 3 },
        { label: 'Efectivo', data: pm.map(f => f.nomina_efectivo), backgroundColor: C_ORANGE, borderRadius: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: C_DIM, font: { size: 11 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtMXN(ctx.parsed.y) } },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: C_DIM, font: { size: 11 } } },
        y: { stacked: true, grid: { color: C_BORDER }, ticks: { color: C_DIM, font: { size: 10 }, callback: v => fmtMXN(v) } },
      },
    },
  });
};

            <td class="num">${G.excluidos.agosto.length}</td>
            <td class="num" style="color:var(--orange)">${fmtMXN(k.agosto_excluido)}</td>
            <td style="font-size:11px;color:var(--sb)">Del 1 y 2 de agosto, quedan para el corte del siguiente mes</td>

            <td class="num">—</td>
            <td class="num" style="color:var(--sb)">—</td>

          </tr>
        </tbody>
      </table>
    </div>
  `;

  // ---- Chart mensual ----
  // Los pesos y el % viven en ejes distintos, asi que hay que calcular el rango
  // del eje derecho para que cada punto quede siempre despejado por arriba de su barra.
  const maxGastoMes = Math.max(...G.por_mes.map(m => m.total));
  const yMaxPesos = maxGastoMes * 1.35;
  const maxPct = Math.max(...G.por_mes.map(m => m.pct_ingreso));
  const y1Max = maxPct * 1.15;
  const HOLGURA = 0.10;                       // 10% de la altura del area de trazo
  let y1Min = 0;
  G.por_mes.forEach(m => {
    const alturaBarra = m.total / yMaxPesos + HOLGURA;
    if (alturaBarra >= 1) return;             // sin solucion posible, se ignora
    const limite = (m.pct_ingreso - y1Max * alturaBarra) / (1 - alturaBarra);
    if (limite < y1Min) y1Min = limite;
  });
  safeChart('gastosMesChart', {
    type: 'bar',
    data: {
      labels: G.por_mes.map(m => cap(m.mes)),
      datasets: [{
        type: 'bar', label: 'Gasto de insumos',
        data: G.por_mes.map(m => m.total),
        backgroundColor: G.por_mes.map(m => m.parcial ? 'rgba(200,164,94,0.35)' : C_GOLD),
        borderColor: G.por_mes.map(m => m.parcial ? C_GOLD : 'transparent'),
        borderWidth: G.por_mes.map(m => m.parcial ? 1 : 0),
        borderRadius: 4, yAxisID: 'y',
      }, {
        type: 'line', label: '% sobre ingreso del mes',
        data: G.por_mes.map(m => m.pct_ingreso),
        borderColor: '#FFFFFF', backgroundColor: '#FFFFFF',
        pointBackgroundColor: '#FFFFFF', pointBorderColor: C_BG, pointBorderWidth: 2,
        yAxisID: 'y1', tension: 0.3, pointRadius: 7, borderWidth: 3, order: -1,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { color: C_DIM, font: { size: 10 } } },
        tooltip: { callbacks: { label: ctx => ctx.datasetIndex === 0
          ? 'Gasto: ' + fmtMXN(ctx.parsed.y)
          : 'Representa ' + ctx.parsed.y.toFixed(2) + '% del ingreso' } }
      },
      scales: {
        x: { grid: { display: false } },
        y: { position: 'left', grid: { color: C_BORDER },
             min: 0, max: yMaxPesos, ticks: { callback: v => fmtMXN(v) } },
        y1: { position: 'right', grid: { display: false },
              min: y1Min, max: y1Max,
              ticks: { callback: v => (v < -0.0001 ? '' : v.toFixed(1) + '%') } }
      }
    }
  });

  // ---- Chart categorias ----
  safeChart('gastosCatChart', {
    type: 'doughnut',
    data: {
      labels: G.por_categoria.map(x => x.categoria),
      datasets: [{
        data: G.por_categoria.map(x => x.total),
        backgroundColor: [C_GREEN, C_ORANGE, C_BLUE, C_CYAN, C_PURPLE],
        borderColor: C_BG, borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'bottom', labels: { color: C_DIM, font: { size: 10 }, padding: 12, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => ctx.label + ': ' + fmtMXN(ctx.parsed) +
          ' (' + (ctx.parsed / G.meta.total * 100).toFixed(1) + '%)' } }
      }
    }
  });

  // ---- Tabla filtrable ----
  let fMes = 'all', fProv = 'all', fQ = '';
  const NOMBRE_PROV = {};
  G.por_proveedor.forEach(p => { NOMBRE_PROV[p.proveedor_key] = p.proveedor; });

  const pintar = () => {
    let lista = G.detalle;
    if (fMes !== 'all') lista = lista.filter(r => r.mes === fMes);
    if (fProv !== 'all') lista = lista.filter(r => r.proveedor === fProv);
    if (fQ) {
      const q = fQ.toLowerCase();
      lista = lista.filter(r =>
        (r.producto || '').toLowerCase().includes(q) ||
        (r.proveedor || '').toLowerCase().includes(q) ||
        (r.folio || '').toLowerCase().includes(q) ||
        (r.fecha || '').includes(q));
    }
    const suma = lista.reduce((a, r) => a + r.costo, 0);
    document.getElementById('gasResumen').textContent =
      `${fmtNum(lista.length)} partidas · ${fmtMXNDec(suma)}`;

    const body = document.getElementById('gasBody');
    if (!lista.length) {
      body.innerHTML = '<tr><td colspan="6" style="padding:32px;text-align:center;color:var(--sb)">No hay partidas que coincidan</td></tr>';
      return;
    }
    body.innerHTML = lista.map(r => `
      <tr>
        <td style="white-space:nowrap;font-size:11px">${fmtDate(r.fecha)}</td>
        <td style="color:${COLOR_PROV[r.proveedor]};font-size:11px">${NOMBRE_PROV[r.proveedor]}</td>
        <td>${r.producto}</td>
        <td class="num" style="color:var(--sb)">${r.cantidad != null ? r.cantidad : '—'}</td>
        <td style="color:var(--sb);font-size:10px">${r.folio || '—'}</td>
        <td class="num gold">${fmtMXNDec(r.costo)}</td>
      </tr>
    `).join('');
  };

  document.querySelectorAll('.gas-filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.gas-filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); fMes = b.dataset.val; pintar();
    });
  });
  document.querySelectorAll('.gas-prov-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.gas-prov-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); fProv = b.dataset.prov; pintar();
    });
  });
  document.getElementById('gasSearch').addEventListener('input', e => { fQ = e.target.value; pintar(); });

  pintar();
};

function matrizGastosHTML(mx) {
  const MES_N = { enero: 'Ene', febrero: 'Feb', marzo: 'Mar', abril: 'Abr', mayo: 'May', junio: 'Jun', julio: 'Jul' };
  let h = '<table class="matrix-table"><thead><tr><th class="canal-header">Proveedor</th>';
  mx.meses.forEach(m => { h += `<th>${MES_N[m]}</th>`; });
  h += '<th class="col-total">Total</th></tr></thead><tbody>';

}

// ===== MODAL DEL DÍA =====
function reservasEnFecha(fecha) {
  // Una reserva está activa la noche de un día si entrada <= fecha < salida
  return DATA.reservas.filter(r => {
    if (r.es_cancelacion || !r.entrada || !r.salida) return false;
    return r.entrada <= fecha && fecha < r.salida;
  });
}

function abrirModalDia(fecha) {
  const diaData = DATA.calendario.find(d => d.fecha === fecha);
  if (!diaData) return;

  const dt = new Date(fecha + 'T00:00:00');
  const dia = dt.getDate();
  const mes = dt.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  const weekday = dt.toLocaleDateString('es-MX', { weekday: 'long' });

  document.getElementById('modalDateDay').textContent = dia;
  document.getElementById('modalDateMonth').textContent = mes;
  document.getElementById('modalDateWeekday').textContent = weekday;

  document.getElementById('modalOcc').textContent = `${diaData.villas_ocupadas}/7`;
  document.getElementById('modalIngresos').textContent = fmtMXN(diaData.ingresos_dia);

  const reservas = reservasEnFecha(fecha);
  document.getElementById('modalReservas').textContent = reservas.length;

  const sectionLabel = document.getElementById('modalSectionLabel');
  const resList = document.getElementById('modalResList');

  if (reservas.length === 0) {
    sectionLabel.textContent = 'Sin reservas';
    resList.innerHTML = '<div class="modal-empty">No hay reservas activas este día</div>';
  } else {
    sectionLabel.textContent = `${reservas.length} reserva${reservas.length === 1 ? '' : 's'} activa${reservas.length === 1 ? '' : 's'}`;

    // Ordenar por villa
    reservas.sort((a, b) => (a.villa_key || '').localeCompare(b.villa_key || ''));

    resList.innerHTML = reservas.map(r => {
      const villaKeyFull = r.villa_key || '';
      const isUnknown = villaKeyFull === 'UNKNOWN' || !villaKeyFull;
      const villaTag = isUnknown ? 'UNK' : villaKeyFull.split('_')[0];
      const villaTagText = isUnknown ? '?' : villaTag.replace('V', '');
      const villaShort = isUnknown ? 'Sin asignar' : (r.villa_nombre ? r.villa_nombre.replace('Villa ', '') : '—');
      const monto = r.hospedaje_neto || r.monto_lh_total || r.monto_tere || 0;
      const tarifaNoche = r.noches ? monto / r.noches : 0;

      // Calcular qué noche de la estancia es
      const entrada = new Date(r.entrada + 'T00:00:00');
      const fechaActual = new Date(fecha + 'T00:00:00');
      const nocheActual = Math.floor((fechaActual - entrada) / (1000 * 60 * 60 * 24)) + 1;

      return `
        <div class="modal-res-card">
          <div class="modal-res-villa-tag modal-res-villa-${villaTag}">${villaTagText}</div>
          <div class="modal-res-info">
            <div class="modal-res-guest">${r.huesped}</div>
            <div class="modal-res-meta">
              <span class="modal-res-meta-item"><strong>${villaShort}</strong></span>
              <span class="modal-res-meta-item">${r.canal_normalizado}</span>
              <span class="modal-res-meta-item">Noche <strong>${nocheActual}</strong> de <strong>${r.noches}</strong></span>
              <span class="modal-res-meta-item">${fmtDate(r.entrada)} → ${fmtDate(r.salida)}</span>
            </div>
          </div>
          <div class="modal-res-amount">
            ${fmtMXN(tarifaNoche)}
            <div style="font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sb);font-family:'Outfit',sans-serif;font-weight:400;margin-top:2px;">por noche</div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('dayModal').classList.add('show');
}

function cerrarModal() {
  document.getElementById('dayModal').classList.remove('show');
}

document.getElementById('modalClose').addEventListener('click', cerrarModal);
document.getElementById('dayModal').addEventListener('click', e => {
  if (e.target.id === 'dayModal') cerrarModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarModal();
});

// ===== MATRIZ CANAL x MES =====
const MES_NOMBRES = { enero: 'Enero', febrero: 'Febrero', marzo: 'Marzo', abril: 'Abril', mayo: 'Mayo', junio: 'Junio', julio: 'Julio' };

function renderCanalMesMatrix() {
  const m = DATA.canal_mes_matrix;
  if (!m) return;
  const wrap = document.getElementById('matrixWrap');
  if (!wrap) return;

  let maxVal = 0;
  for (const canal of m.canales) {
    for (const mes of m.meses) {
      const v = m.datos[canal][mes].total;
      if (v > maxVal) maxVal = v;
    }
  }
  const heatLevel = v => {
    if (v <= 0) return 0;
    const r = v / maxVal;
    if (r < 0.10) return 1;
    if (r < 0.25) return 2;
    if (r < 0.45) return 3;
    if (r < 0.70) return 4;
    return 5;
  };

  let html = '<table class="matrix-table"><thead><tr>';
  html += '<th class="canal-header">Canal</th>';
  for (const mes of m.meses) {
    const label = MES_NOMBRES[mes] || mes;
    const isAbril = mes === 'junio';
    const badge = isAbril ? '<span class="matrix-prelim-badge">prelim</span>' : '';
    html += '<th>' + label + badge + '</th>';
  }
  html += '<th class="col-total">Total</th></tr></thead><tbody>';

  for (const canal of m.canales) {
    html += '<tr>';
    html += '<td class="canal-name">' + canal + '</td>';
    for (const mes of m.meses) {
      const cell = m.datos[canal][mes];
      const lvl = heatLevel(cell.total);
      const emptyClass = cell.total === 0 ? ' empty' : '';
      const val = cell.total > 0 ? fmtMXN(cell.total) : '—';
      html += '<td class="matrix-cell h-' + lvl + emptyClass + '" data-canal="' + canal + '" data-mes="' + mes + '">' + val + '</td>';
    }
    const cTotal = m.totales_canal[canal].total;
    html += '<td class="col-total">' + fmtMXN(cTotal) + '</td></tr>';
  }

  html += '<tr class="totals"><td class="canal-name">Total</td>';
  for (const mes of m.meses) {
    const t = m.totales_mes[mes].total;
    html += '<td>' + fmtMXN(t) + '</td>';
  }
  html += '<td class="col-total">' + fmtMXN(m.total_general.total) + '</td></tr>';
  html += '</tbody></table>';

  wrap.innerHTML = html;

  wrap.querySelectorAll('.matrix-cell:not(.empty)').forEach(c => {
    c.addEventListener('click', () => {
      const canal = c.dataset.canal;
      const mes = c.dataset.mes;
      mostrarDetalleCelda(canal, mes);
      wrap.querySelectorAll('.matrix-cell').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    });
  });
}

function mostrarDetalleCelda(canal, mes) {
  const m = DATA.canal_mes_matrix;
  const cell = m.datos[canal][mes];
  const mesLabel = MES_NOMBRES[mes] || mes;
  const isAbril = mes === 'junio';
  const adr = cell.noches > 0 ? cell.hospedaje / cell.noches : 0;
  const prelimText = isAbril ? ' (preliminar)' : '';

  const detail = document.getElementById('matrixDetail');
  detail.innerHTML =
    '<div class="matrix-detail-header">' +
      '<div>' +
        '<div class="matrix-detail-subtitle">' + canal + ' · ' + mesLabel + ' 2026' + prelimText + '</div>' +
        '<div class="matrix-detail-title">' + fmtMXN(cell.total) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="matrix-detail-grid">' +
      '<div><div class="matrix-detail-stat-label">Reservas</div><div class="matrix-detail-stat-value">' + cell.reservas + '</div></div>' +
      '<div><div class="matrix-detail-stat-label">Noches</div><div class="matrix-detail-stat-value">' + cell.noches + '</div></div>' +
      '<div><div class="matrix-detail-stat-label">Hospedaje</div><div class="matrix-detail-stat-value">' + fmtMXN(cell.hospedaje) + '</div></div>' +
      '<div><div class="matrix-detail-stat-label">Extras</div><div class="matrix-detail-stat-value">' + fmtMXN(cell.extras) + '</div></div>' +
      '<div><div class="matrix-detail-stat-label">Tarifa promedio</div><div class="matrix-detail-stat-value gold">' + fmtMXN(adr) + '</div></div>' +

}

renderers.reservas = () => {
  const c = document.getElementById('tab-reservas');

  c.innerHTML = `
    <div class="sh">
      <div>
        <div class="sh-sub">Detalle Completo</div>
        <div class="sh-title">Reservas</div>
      </div>
    </div>

    <div class="res-filters">
      <button class="res-filter-btn active" data-filter="all">Todas (${DATA.reservas.length})</button>
      <button class="res-filter-btn" data-filter="active">Activas (${DATA.reservas.filter(r => !r.es_cancelacion).length})</button>
      <button class="res-filter-btn" data-filter="cancelled">Canceladas (${DATA.reservas.filter(r => r.es_cancelacion).length})</button>
      <button class="res-filter-btn" data-filter="audit">Para revisar (${DATA.auditoria.length})</button>
      <button class="res-filter-btn" data-filter="pending">Pendiente Tere (${DATA.reservas.filter(r => r.score === 'PENDIENTE').length})</button>
      <input type="text" class="res-search" id="resSearch" placeholder="Buscar huésped...">
    </div>

    <div class="res-list" id="resList"></div>
  `;

  let filtroActual = 'all';
  let busqueda = '';

  const renderList = () => {
    let lista = DATA.reservas;
    if (filtroActual === 'active') lista = lista.filter(r => !r.es_cancelacion);
    else if (filtroActual === 'cancelled') lista = lista.filter(r => r.es_cancelacion);
    else if (filtroActual === 'audit') lista = lista.filter(r => r.score !== 'VERDE' && r.score !== 'PENDIENTE');
    else if (filtroActual === 'pending') lista = lista.filter(r => r.score === 'PENDIENTE');

    if (busqueda) {
      const q = busqueda.toLowerCase();
      lista = lista.filter(r => (r.huesped || '').toLowerCase().includes(q) ||
        (r.canal_normalizado || '').toLowerCase().includes(q));
    }

    lista.sort((a,b) => {
      if (!a.entrada) return 1;
      if (!b.entrada) return -1;
      return new Date(b.entrada) - new Date(a.entrada);
    });

    const container = document.getElementById('resList');
    if (lista.length === 0) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--sb)">No hay reservas que coincidan</div>';
      return;
    }

    container.innerHTML = lista.map(r => {
      const scoreClass = { VERDE: 'green', AMARILLO: 'yellow', ROJO: 'red', INVESTIGAR: 'blue', PENDIENTE: 'gray' }[r.score] || 'gold';
      const scoreText = { VERDE: '✓', AMARILLO: '⚠', ROJO: '✗', INVESTIGAR: '?', PENDIENTE: '⏳' }[r.score] || '·';
      const monto = r.hospedaje_neto || r.monto_lh_total || r.monto_tere || 0;

      return `
        <div class="res-row ${r.es_cancelacion ? 'cancelled' : ''}">
          <span class="pill ${scoreClass}">${scoreText}</span>
          <div>
            <div class="res-name">${r.huesped}</div>
            <div class="res-meta">
              <span>${r.canal_normalizado}</span>
              <span>${r.villa_nombre}</span>
              ${r.es_cancelacion ? '<span style="color:var(--red)">CANCELADA</span>' : ''}
            </div>
          </div>
          <div style="font-size:10px;color:var(--sb)">${fmtDate(r.entrada)}</div>
          <div style="font-size:10px;color:var(--sb)">${r.noches || '—'} ${r.noches === 1 ? 'noche' : 'noches'}</div>
          <div style="font-size:10px;color:var(--sb)">${r.ref_lh || '—'}</div>
          <div class="res-amount">${monto ? fmtMXN(monto) : '—'}</div>
        </div>
      `;
    }).join('');
  };

  document.querySelectorAll('.res-filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.res-filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filtroActual = b.dataset.filter;
      renderList();
    });
  });

  document.getElementById('resSearch').addEventListener('input', e => {
    busqueda = e.target.value;
    renderList();
  });

  renderList();
};

// ===== RESTAURAR SESIÓN (al final, después de definir renderers) =====
const stored = sessionStorage.getItem('sl_user');
if (stored) {
  try { enterApp(JSON.parse(stored)); } catch(e) { console.error('Session restore failed:', e); }
}

</script>
</body>
</html>
